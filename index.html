<style>
:root{
  --bg:#e6efff; --panel:#ffffff; --ink:#2a3560; --muted:#6c77a8; --line:#d3def7;
  --accent:#3d6bff; --accent-soft:#e3eaff; --accent-ink:#ffffff; --shadow:rgba(61,107,255,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a30; --panel:#232848; --ink:#eef1ff; --muted:#a4aedd; --line:#39406b;
    --accent:#7a9bff; --accent-soft:#33396a; --accent-ink:#131735; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#161a30; --panel:#232848; --ink:#eef1ff; --muted:#a4aedd; --line:#39406b;
  --accent:#7a9bff; --accent-soft:#33396a; --accent-ink:#131735; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Yuanti TC","PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
header{max-width:1400px;margin:0 auto;padding:18px 22px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:28px;letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:15px}

.layout{
  display:grid;grid-template-columns:272px minmax(0,1fr) 272px;gap:18px;
  max-width:1400px;margin:0 auto;padding:6px 22px 30px;align-items:start;
}
.panel{
  background:var(--panel);border-radius:22px;padding:16px;
  box-shadow:0 5px 0 var(--shadow);
}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:600}
.panel section+section{margin-top:18px}

/* tools */
.tools-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{
  border:3px solid var(--line);background:var(--panel);border-radius:16px;
  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;
}
.tool .ico{font-size:26px;line-height:1.1}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tool:focus-visible,.crayon:focus-visible,.thumb:focus-visible,.act:focus-visible,.brush:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* brush kinds (solid / gradient / stamp) */
.brush-group+.brush-group{margin-top:12px}
.brush-cap{margin:0 0 6px 2px;font-size:13px;color:var(--muted)}
.brushes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;transition:opacity .15s}
.brush-sec.off .brushes{opacity:.5}
.brush{
  border:3px solid var(--line);background:var(--panel);border-radius:14px;
  padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;
}
.brush:hover{border-color:var(--accent)}
.brush[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.brush .swatch{display:block;width:36px;height:22px;border-radius:11px;background:var(--sw);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.stampico{fill:var(--cur);stroke:var(--cur);stroke-width:.12;stroke-linejoin:round;filter:drop-shadow(0 0 .6px rgba(0,0,0,.6))}
.brush .stampico{width:26px;height:22px;display:block}

.size-row{display:flex;align-items:center;gap:12px}
.size-row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.size-preview{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--accent-soft);border-radius:14px}
.size-preview i{display:block;border-radius:50%;background:#ff5c8a;width:16px;height:16px}
.size-preview .stampico{display:none}

/* crayon box */
.crayons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 6px;padding-top:8px}
.crayon{
  position:relative;border:0;padding:0;height:60px;background:var(--c);
  border-radius:16px 16px 5px 5px / 30px 30px 5px 5px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);
  transition:transform .12s;
}
.crayon::after{ /* paper wrapper band */
  content:"";position:absolute;left:0;right:0;top:46%;height:26%;
  background:rgba(255,255,255,.42);border-top:2px solid rgba(0,0,0,.12);border-bottom:2px solid rgba(0,0,0,.12);
}
.crayon:hover{transform:translateY(-3px)}
.crayon[aria-pressed="true"]{transform:translateY(-9px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 0 0 3px var(--accent)}
.custom{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.custom input{width:46px;height:34px;padding:0;border:3px solid var(--line);border-radius:10px;background:none;cursor:pointer}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:9px 6px;font-size:15px}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.act.primary:hover:not(:disabled){filter:brightness(1.08)}
.bar{display:flex;gap:8px;width:min(100%,calc(100vh - 200px));width:min(100%,calc(100dvh - 200px));min-width:280px}
.bar .act{flex:1;padding:11px 6px;font-size:16px;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(20,26,60,.55)}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;padding:18px;text-align:center;background:var(--panel);border-radius:24px;box-shadow:0 8px 0 var(--shadow)}
.sheet h3{margin:0 0 12px;font-size:20px}
.sheet img{display:block;width:100%;max-height:58vh;object-fit:contain;background:#fff;border-radius:16px;box-shadow:0 0 0 3px var(--line);-webkit-touch-callout:default}
.sheet .tip{margin:12px 0;color:var(--muted);font-size:14px;line-height:1.5}
.sheet .row{display:flex;gap:8px}
.sheet .row .act{flex:1;padding:12px 6px;font-size:16px}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.4;cursor:default}

/* stage */
.stagewrap{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{
  position:relative;width:min(100%,calc(100vh - 200px));width:min(100%,calc(100dvh - 200px));min-width:280px;aspect-ratio:1;
  background:#fff;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 6px var(--panel),0 10px 0 6px var(--shadow);
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lines{pointer-events:none}
.ring{
  position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;display:none;
  border:2px solid #2a3560;box-shadow:0 0 0 1.5px #fff;
}
.hint{color:var(--muted);font-size:15px;min-height:22px;text-align:center}

/* gallery */
/* right column: collapsed picture picker + crayon box */
.right{max-height:calc(100vh - 24px);overflow:auto;position:sticky;top:12px}
.pickhead{
  width:100%;display:flex;align-items:center;gap:8px;text-align:left;
  border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 12px;font-size:15px;
}
.pickhead:hover{border-color:var(--accent)}
.pickhead[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pickhead:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pickhead .pt{font-weight:600;color:var(--muted);white-space:nowrap}
.pickhead .pt .count{font-weight:400;font-size:12px}
.pickhead .cur{flex:1;min-width:0;text-align:right;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickhead .chev{flex:none;transition:transform .15s}
.pickhead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pickbody{margin-top:10px}
.pickbody[hidden]{display:none}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.thumb{
  border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:#2a3560;font-size:13px;
}
.thumb[hidden]{display:none}
.thumb canvas{width:100%;aspect-ratio:1;display:block}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:14px}
.cat:hover{border-color:var(--accent)}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.cat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb:hover{border-color:var(--accent)}
.thumb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr)}   /* minmax(0,…) stops wide content from stretching the page */
  .right{position:static;max-height:none;overflow:visible}
  .stagewrap{order:1}
  .right{order:2}
  .tools{order:3}
  .stage,.bar{width:100%;width:min(100%,max(240px,calc(100dvh - 150px)));min-width:0}
  .thumbs{display:flex;max-height:none;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
  .thumb{flex:0 0 104px}
  .cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .cat{flex:none}
}
/* iPad portrait and other mid-size screens: tools on the left; canvas with the picker + crayon box right under it */
@media (min-width:700px) and (max-width:1040px){
  .layout{grid-template-columns:260px minmax(0,1fr)}
  .tools{order:1;grid-column:1;grid-row:1 / span 2}
  .stagewrap{order:2;grid-column:2;grid-row:1}
  .right{order:3;grid-column:2;grid-row:2}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);max-height:300px;overflow-x:hidden;overflow-y:auto}
  .thumb{flex:none}
  .cats{flex-wrap:wrap;overflow:visible}
}

/* ---------- canvases ---------- */
const paint = $('#paint'), lines = $('#lines'), stage = $('#stage'), ring = $('#ring');
paint.width = paint.height = lines.width = lines.height = N;
const lctx = lines.getContext('2d', { willReadFrequently: true });
const pctx = paint.getContext('2d', { willReadFrequently: true });

let barrier = new Uint8Array(N * N);   // 1 where an outline is
let current = -1, dirty = false;
const saved = new Map();               // id -> PNG data URL of unfinished work (small, so 50 pictures stay cheap on an iPad)
let restoring = null;                  // id whose saved work is still being decoded
const undoStack = [];

function loadPicture(i) {
  if (current >= 0) {
    const id = PICS[current].id;
    if (restoring === id) { /* still decoding: the saved copy is the truth, keep it */ }
    else if (dirty) saved.set(id, paint.toDataURL()); else saved.delete(id);
  }
  current = i;
  lctx.clearRect(0, 0, N, N);
  const g = toolkit(lctx, N, 1.25);
  g.begin(); PICS[i].draw(g); g.end();
  const a = lctx.getImageData(0, 0, N, N).data;
  for (let k = 0; k < N * N; k++) barrier[k] = a[k * 4 + 3] > 110 ? 1 : 0;
  pctx.clearRect(0, 0, N, N);
  const id = PICS[i].id, s = saved.get(id);
  dirty = !!s; restoring = null;
  if (s) {
    restoring = id;
    const img = new Image();
    img.onload = () => {
      if (restoring !== id) return;
      restoring = null;
      if (current === i) {                       // draw underneath anything painted while it was loading
        pctx.save(); pctx.globalCompositeOperation = 'destination-over'; pctx.drawImage(img, 0, 0); pctx.restore();
      }
    };
    img.onerror = () => { if (restoring === id) restoring = null; };
    img.src = s;
  }
  undoStack.length = 0; redoStack.length = 0; syncUndo();
  document.querySelectorAll('.thumb').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  $('#curName').textContent = PICS[i].name;
}

const GRAD_PERIOD = 520;               // canvas px of stroke for one full colour cycle

// colour at distance `dist` along a stroke; rainbow wraps around, the others ping-pong so they stay smooth
function gradColor(g, dist) {
  const n = g.rgb.length;
  let t = ((dist / GRAD_PERIOD) % 1 + 1) % 1, f, i, j;
  if (g.loop) { f = t * n; i = Math.floor(f) % n; j = (i + 1) % n; }
  else { const u = t < 0.5 ? t * 2 : 2 - t * 2; f = u * (n - 1); i = Math.min(Math.floor(f), n - 2); j = i + 1; }
  const k = f - Math.floor(f) , a = g.rgb[i], b = g.rgb[j];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * k)},${Math.round(a[1] + (b[1] - a[1]) * k)},${Math.round(a[2] + (b[2] - a[2]) * k)})`;
}

  const a = off + i * 2 * Math.PI / n; return [R * Math.cos(a), R * Math.sin(a) + dy];
});

Object.values(STAMPS).forEach(s => { s.path = new Path2D(s.d); });
const isStamp = k => k in STAMPS;
const stampDia = () => 12 + size * 1.5;          // stamp width in canvas px follows the size slider

function drawStamp(ctx, kind, x, y, dia, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dia / 2, dia / 2);
  ctx.fillStyle = ctx.strokeStyle = c; ctx.lineWidth = 0.12; ctx.lineJoin = 'round';
  ctx.fill(STAMPS[kind].path); ctx.stroke(STAMPS[kind].path);   // stroke = softly rounded corners
  ctx.restore();
}

const brushName = k => k === 'solid' ? '純色' : (GRADS[k] || STAMPS[k]).name;
const brushBtns = {};
function addBrush(box, kind, iconHTML) {
  const b = document.createElement('button');
  b.className = 'brush'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', brushName(kind) + '筆');
  b.innerHTML = iconHTML + '<span>' + brushName(kind) + '</span>';
  b.addEventListener('click', () => setBrush(kind));
  box.appendChild(b); brushBtns[kind] = b;
}
const colorBox = $('#colorBrushes'), stampBox = $('#stampBrushes');
addBrush(colorBox, 'solid', '<i class="swatch" style="--sw:var(--cur)"></i>');
Object.keys(GRADS).forEach(k => addBrush(colorBox, k, `<i class="swatch" style="--sw:${GRADS[k].css}"></i>`));
Object.keys(STAMPS).forEach(k => addBrush(stampBox, k,
  `<svg class="stampico" viewBox="-1.06 -1.06 2.12 2.12" aria-hidden="true"><path d="${STAMPS[k].d}"/></svg>`));

function setColor(c, fromCrayon) {
  color = c;
  crayons.querySelectorAll('.crayon').forEach((b, i) => b.setAttribute('aria-pressed', fromCrayon && COLORS[i] === c));
  document.documentElement.style.setProperty('--cur', c);
  updatePreview();
  if (tool === 'eraser') setTool('pen');
}
function setBrush(k) {
  brush = k;
  Object.entries(brushBtns).forEach(([id, b]) => b.setAttribute('aria-pressed', id === k));
  if (tool === 'eraser') setTool('pen'); else { updateHint(); updatePreview(); }
}
function updateHint() {
  const n = brushName(brush);
  const pen = isStamp(brush) ? `按住拖曳，沿著筆跡蓋出一排${n}，大小跟著粗細變。`
            : GRADS[brush]   ? `按住拖曳，畫出會一路變色的${n}漸層線條。`
            : '按住滑鼠或觸控板拖曳，就能畫畫。';
  const fill = isStamp(brush) ? `點一下圖案的某一塊，鋪滿${n}圖案（大小跟著粗細）。`
             : GRADS[brush]   ? `點一下圖案的某一塊，用${n}漸層填滿。`
             : '點一下圖案的某一塊，整塊一次塗滿。';
  $('#hint').textContent = { pen, eraser: '按住拖曳，把顏色擦掉。', fill }[tool];
}
// the little preview beside the slider shows what the current brush looks like
function updatePreview() {
  const dot = $('#sizeDot'), sv = $('#sizeStamp'), d = 8 + size * 0.5;
  const stamp = tool !== 'eraser' && isStamp(brush), grad = tool !== 'eraser' && GRADS[brush];
  dot.style.display = stamp ? 'none' : 'block';
  sv.style.display = stamp ? 'block' : 'none';
  dot.style.width = dot.style.height = sv.style.width = sv.style.height = d + 'px';
  dot.style.background = grad ? grad.css : color;
  if (stamp) $('#sizeStampPath').setAttribute('d', STAMPS[brush].d);
}
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
  $('#brushSec').classList.toggle('off', t === 'eraser');
  stage.style.cursor = t === 'fill' ? 'pointer' : 'none';
  if (t === 'fill') ring.style.display = 'none';
  updateHint(); updatePreview();
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#custom').addEventListener('input', e => setColor(e.target.value, false));
$('#size').addEventListener('input', e => { size = +e.target.value; updatePreview(); });

/* ---------- undo / clear ---------- */
const redoStack = [];                  // snapshots we stepped back from, so 「下一步」 can bring them back
function syncUndo() {
  $('#undo').disabled = $('#undo2').disabled = undoStack.length === 0;
  $('#redo').disabled = redoStack.length === 0;
}
function pushUndo() {
  undoStack.push(pctx.getImageData(0, 0, N, N));
  if (undoStack.length > 20) undoStack.shift();
  redoStack.length = 0;                // a new action starts a new "future"
  syncUndo();
}
function doUndo() {
  const s = undoStack.pop();
  if (s) { redoStack.push(pctx.getImageData(0, 0, N, N)); pctx.putImageData(s, 0, 0); dirty = true; }
  syncUndo();
}
function doRedo() {
  const s = redoStack.pop();
  if (s) { undoStack.push(pctx.getImageData(0, 0, N, N)); pctx.putImageData(s, 0, 0); dirty = true; }
  syncUndo();
}
$('#undo').addEventListener('click', doUndo);
$('#undo2').addEventListener('click', doUndo);
$('#redo').addEventListener('click', doRedo);
$('#clear').addEventListener('click', () => { pushUndo(); pctx.clearRect(0, 0, N, N); dirty = false; });

/* ---------- drawing ---------- */
const pos = e => {
  const r = paint.getBoundingClientRect();
  return { x: (e.clientX - r.left) * N / r.width, y: (e.clientY - r.top) * N / r.height };
};
function brushStyle() {
  pctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
  pctx.strokeStyle = pctx.fillStyle = color;
  pctx.lineWidth = size; pctx.lineCap = pctx.lineJoin = 'round';
}
let drawing = false, last = null, lastMid = null;
let kind = 'solid';                    // brush actually used by the current stroke ('eraser' for the eraser)
let walkPrev = null, segStart = null, segLen = 0;   // gradient pen: current segment
let stampCarry = 0;                    // stamp pen: distance walked since the last stamp
let gradDist = 0;                      // distance along the gradient; continues from stroke to stroke
let stampSize = 0, stampGap = 0;       // fixed for the whole stroke

const GRAD_SEG = 8;                    // gradient pen draws one linear-gradient segment per ~8px of path

function startStroke(p) {
  brushStyle();
  kind = tool === 'eraser' ? 'eraser' : brush;
  if (isStamp(kind)) {
    stampSize = stampDia(); stampGap = stampSize * 1.2;   // even spacing, small gap between stamps
    stampCarry = 0; walkPrev = p;
    drawStamp(pctx, kind, p.x, p.y, stampSize, color);
  } else if (GRADS[kind]) {
    segStart = walkPrev = p; segLen = 0;
    pctx.fillStyle = gradColor(GRADS[kind], gradDist);
    pctx.beginPath(); pctx.arc(p.x, p.y, size / 2, 0, Math.PI * 2); pctx.fill();
  } else {
    pctx.beginPath(); pctx.arc(p.x, p.y, size / 2, 0, Math.PI * 2); pctx.fill();
  }
  last = lastMid = p; dirty = true;
}

// stamps: walk the path and drop a stamp every `stampGap` px of arc length, whatever the pointer speed
function walkStamp(a, b) {
  const l = Math.hypot(b.x - a.x, b.y - a.y);
  if (!l) return;
  let d = stampGap - stampCarry;
  while (d <= l) {
    const t = d / l;
    drawStamp(pctx, kind, a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, stampSize, color);
    d += stampGap;
  }
  stampCarry = l - (d - stampGap);
}
// gradient pen: one segment stroked with a linear gradient from the colour at its start to the colour at its end
function gradSegment(a, b) {
  const l = Math.hypot(b.x - a.x, b.y - a.y);
  if (!l) return;
  const g = GRADS[kind], lg = pctx.createLinearGradient(a.x, a.y, b.x, b.y);
  lg.addColorStop(0, gradColor(g, gradDist)); lg.addColorStop(1, gradColor(g, gradDist + l));
  pctx.strokeStyle = lg;
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
  gradDist += l;
}
function walkGrad(a, b) {
  segLen += Math.hypot(b.x - a.x, b.y - a.y);
  if (segLen >= GRAD_SEG) { gradSegment(segStart, b); segStart = b; segLen = 0; }
}

function extendStroke(p) {
  const m = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
  if (kind === 'solid' || kind === 'eraser') {
    pctx.beginPath(); pctx.moveTo(lastMid.x, lastMid.y);
    pctx.quadraticCurveTo(last.x, last.y, m.x, m.y); pctx.stroke();
  } else {
    // same smoothed curve as the plain pen, but sampled every ~3px so we can measure distance along it
    const A = lastMid, B = last, Cc = m;
    const n = Math.max(1, Math.ceil((Math.hypot(B.x - A.x, B.y - A.y) + Math.hypot(Cc.x - B.x, Cc.y - B.y)) / 3));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t;
      const q = { x: u * u * A.x + 2 * u * t * B.x + t * t * Cc.x, y: u * u * A.y + 2 * u * t * B.y + t * t * Cc.y };
      (isStamp(kind) ? walkStamp : walkGrad)(walkPrev, q);
      walkPrev = q;
    }
  }
  last = p; lastMid = m;
}
function finishStroke() {
  if (drawing && isStamp(kind)) walkStamp(walkPrev, last);          // carry on to where the pointer really ended
  else if (drawing && GRADS[kind]) { walkGrad(walkPrev, last); if (segLen > 0) gradSegment(segStart, last); }
  drawing = false;
}

function doFill(p) {
  const sx = Math.max(0, Math.min(N - 1, Math.round(p.x)));
  const sy = Math.max(0, Math.min(N - 1, Math.round(p.y)));
  let idx = sy * N + sx;
  if (barrier[idx]) {                       // clicked on an outline: look around it
    idx = -1;
    for (let r = 1; r <= 6 && idx < 0; r++)
      for (let dy = -r; dy <= r && idx < 0; dy++)
        for (let dx = -r; dx <= r; dx++) {
          const x = sx + dx, y = sy + dy;
          if (x < 0 || y < 0 || x >= N || y >= N) continue;
          if (!barrier[y * N + x]) { idx = y * N + x; break; }
        }
    if (idx < 0) return;
  }
  pushUndo();
  const solid = brush === 'solid';       // gradient / pattern fills are painted afterwards through a mask
  const img = solid ? pctx.getImageData(0, 0, N, N) : null, d = img && img.data;
  const [rr, gg, bb] = hex2rgb(color);
  const seen = new Uint8Array(N * N), stack = new Int32Array(N * N);
  const bb2 = { x0: N, y0: N, x1: 0, y1: 0 };
  let sp = 0; stack[sp++] = idx; seen[idx] = 1;
  while (sp) {
    const i = stack[--sp], x = i % N;
    if (solid) { const o = i * 4; d[o] = rr; d[o + 1] = gg; d[o + 2] = bb; d[o + 3] = 255; }
    else { const y = (i / N) | 0; if (x < bb2.x0) bb2.x0 = x; if (x > bb2.x1) bb2.x1 = x; if (y < bb2.y0) bb2.y0 = y; if (y > bb2.y1) bb2.y1 = y; }
    let j;
    if (x > 0)         { j = i - 1; if (!seen[j] && !barrier[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (x < N - 1)     { j = i + 1; if (!seen[j] && !barrier[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (i >= N)        { j = i - N; if (!seen[j] && !barrier[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (i < N * (N-1)) { j = i + N; if (!seen[j] && !barrier[j]) { seen[j] = 1; stack[sp++] = j; } }
  }
  if (solid) pctx.putImageData(img, 0, 0); else paintRegion(seen, bb2);
  dirty = true;
}

/* gradient / pattern bucket: draw the art on a scratch canvas, keep only the flooded region, lay it on the paint layer */
let fxCv = null, fxCtx = null, mkCv = null, mkCtx = null;
const mixWhite = (c, t) => 'rgb(' + hex2rgb(c).map(v => Math.round(v + (255 - v) * t)).join(',') + ')';
function paintRegion(seen, bb) {
  if (!fxCv) {
    fxCv = document.createElement('canvas'); mkCv = document.createElement('canvas');
    fxCv.width = fxCv.height = mkCv.width = mkCv.height = N;
    fxCtx = fxCv.getContext('2d'); mkCtx = mkCv.getContext('2d');
  }
  const w = bb.x1 - bb.x0 + 1, h = bb.y1 - bb.y0 + 1;
  fxCtx.globalCompositeOperation = 'source-over'; fxCtx.clearRect(0, 0, N, N);
  if (GRADS[brush]) {
    const g = GRADS[brush], lg = fxCtx.createLinearGradient(bb.x0, bb.y0, bb.x0 + Math.max(w, 1), bb.y0 + Math.max(h, 1));
    g.stops.forEach((c, i) => lg.addColorStop(i / (g.stops.length - 1), c));
    fxCtx.fillStyle = lg; fxCtx.fillRect(bb.x0, bb.y0, w, h);
  } else {                               // stamp pattern: pale tint of the colour + offset rows of stamps
    fxCtx.fillStyle = mixWhite(color, 0.8); fxCtx.fillRect(bb.x0, bb.y0, w, h);
    const dia = stampDia(), stepX = dia * 1.45, stepY = stepX * 0.9;
    let row = Math.floor(bb.y0 / stepY) - 1;
    for (let y = row * stepY; y <= bb.y1 + stepY; y += stepY, row++) {
      const off = (row & 1) ? stepX / 2 : 0;
      for (let x = Math.floor(bb.x0 / stepX) * stepX - stepX + off; x <= bb.x1 + stepX; x += stepX)
        drawStamp(fxCtx, brush, x, y, dia, color);
    }
  }
  const mask = mkCtx.createImageData(N, N), m = mask.data;   // alpha 255 inside the flooded region
  for (let y = bb.y0; y <= bb.y1; y++)
    for (let x = bb.x0, i = y * N + x; x <= bb.x1; x++, i++) if (seen[i]) m[i * 4 + 3] = 255;
  mkCtx.putImageData(mask, 0, 0);
  fxCtx.globalCompositeOperation = 'destination-in'; fxCtx.drawImage(mkCv, 0, 0);
  fxCtx.globalCompositeOperation = 'source-over';
  pctx.save(); pctx.globalCompositeOperation = 'source-over'; pctx.drawImage(fxCv, 0, 0); pctx.restore();
}

function moveRing(e) {
  if (tool === 'fill') { ring.style.display = 'none'; return; }
  const r = stage.getBoundingClientRect(), d = (tool === 'pen' && isStamp(brush) ? stampDia() : size) * r.width / N;
  ring.style.display = 'block';
  ring.style.width = ring.style.height = d + 'px';
  ring.style.transform = `translate(${e.clientX - r.left - d / 2}px,${e.clientY - r.top - d / 2}px)`;
}

stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const p = pos(e);
  if (tool === 'fill') { doFill(p); return; }
  pushUndo();
  drawing = true;
  stage.setPointerCapture(e.pointerId);
  startStroke(p);
  moveRing(e);
});
stage.addEventListener('pointermove', e => {
  moveRing(e);
  if (!drawing) return;
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  (evs.length ? evs : [e]).forEach(ev => extendStroke(pos(ev)));
});
stage.addEventListener('pointerup', finishStroke);
stage.addEventListener('pointercancel', finishStroke);
stage.addEventListener('pointerleave', () => { if (!drawing) ring.style.display = 'none'; });

window.addEventListener('keydown', e => {
  if ($('#modal') && !$('#modal').hidden) { if (e.key === 'Escape') closeSave(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') setTool('pen'); else if (k === 'e') setTool('eraser'); else if (k === 'f') setTool('fill');
});

/* ---------- save the finished picture as a PNG ---------- */
let saveFile = null, saveUrl = '';
const canShareFiles = () => !!(saveFile && navigator.maxTouchPoints > 1 && navigator.canShare && navigator.canShare({ files: [saveFile] }));
function closeSave() {
  $('#modal').hidden = true;
  if (saveUrl) URL.revokeObjectURL(saveUrl);
  saveUrl = ''; saveFile = null; $('#preview').removeAttribute('src');
}
$('#save').addEventListener('click', () => {
  if (drawing) return;
  const out = document.createElement('canvas'); out.width = out.height = N;
  const c = out.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, N, N);       // white paper, then the colours, then the outlines on top
  c.drawImage(paint, 0, 0); c.drawImage(lines, 0, 0);
  out.toBlob(blob => {
    if (!blob) return;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `小小畫家-${PICS[current].name}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
    if (saveUrl) URL.revokeObjectURL(saveUrl);
    saveFile = new File([blob], name, { type: 'image/png' });
    saveUrl = URL.createObjectURL(blob);
    $('#preview').src = saveUrl;
    $('#tip').textContent = canShareFiles()
      ? '按「儲存圖片」，再選「儲存影像」就會存進相簿。也可以直接用手指長按上面的圖片。'
      : '按「儲存圖片」會把作品下載成一張 PNG 圖檔。';
    $('#modal').hidden = false;
    $('#doSave').focus();
  }, 'image/png');
});
$('#doSave').addEventListener('click', async () => {
  if (!saveFile) return;
  if (canShareFiles()) {                             // iPad / phone: the system share sheet has "save image"
    try { await navigator.share({ files: [saveFile], title: '小小畫家' }); return; }
    catch (err) { if (err && err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = saveUrl; a.download = saveFile.name;
  document.body.appendChild(a); a.click(); a.remove();
});
$('#closeModal').addEventListener('click', closeSave);
$('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeSave(); });

/* ---------- gallery (folded away until you ask for it) ---------- */
function setPickOpen(open) {
  $('#pickToggle').setAttribute('aria-expanded', open);
  $('#pickBody').hidden = !open;
}
$('#pickToggle').addEventListener('click', () => setPickOpen($('#pickBody').hidden));
const thumbs = $('#thumbs');
PICS.forEach((pic, i) => {
  const b = document.createElement('button');
  b.className = 'thumb'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', pic.name);
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const g = toolkit(c.getContext('2d'), 240, 1.9);
  g.begin(); pic.draw(g); g.end();
  const t = document.createElement('span'); t.textContent = pic.name;
  b.append(c, t);
  b.addEventListener('click', () => { loadPicture(i); setPickOpen(false); });   // pick, then fold the list away so the crayons stay in reach
  thumbs.appendChild(b);
});
$('#count').textContent = '（' + PICS.filter(p => p.id !== 'blank').length + ' 張）';

// category buttons: hide/show thumbnails (indexes stay the same, so nothing else needs to know)
const catsBox = $('#cats');
function showCategory(name) {
  catsBox.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === name));
  document.querySelectorAll('.thumb').forEach((t, k) => { t.hidden = !(name === '全部' || !PICS[k].cat || PICS[k].cat === name); });
  thumbs.scrollLeft = 0; thumbs.scrollTop = 0;
}
['全部', ...CATEGORIES.map(c => c[0])].forEach(name => {
  const b = document.createElement('button');
  b.className = 'cat'; b.dataset.cat = name; b.textContent = name; b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => showCategory(name));
  catsBox.appendChild(b);
});
showCategory('全部');

/* ---------- start ---------- */
setColor(color, true);
setBrush('solid');
setTool('pen');
loadPicture(0);
})();
</script>
</body>
</html>
